[program:moo-mcp]
command=/usr/bin/node src/index.js
directory=/opt/moo-mcp
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=NODE_ENV="production"
stdout_logfile=/opt/moo-mcp/logs/supervisor-moo-mcp.out.log
stderr_logfile=/opt/moo-mcp/logs/supervisor-moo-mcp.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
